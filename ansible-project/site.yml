- name: Configure campus switches
  hosts: switches
  gather_facts: false
  roles:
    - { role: vlans,        tags: ['vlans'] }
    - { role: trunking,     tags: ['trunking'] }
    - { role: access_ports, tags: ['access_ports'] }
    - { role: stp,          tags: ['stp'] }
    - { role: routing,      tags: ['routing'] }
    - { role: acls,         tags: ['acls'] }
  post_tasks:
    - name: Save running-config to startup-config (write config)
      cisco.ios.ios_config:
        save_when: modified
      tags: ['always']
