---
dept_vlan: 30
dept_vlan_name: VLAN_DMME

trunk_interfaces:
  - name: GigabitEthernet0/0
    description: "Trunk to SW-CORE"
  - name: GigabitEthernet0/1
    description: "Trunk to SW-A-DMME"

svi:
  vlan_id: 30
  ip: 10.10.30.1
  mask: 255.255.255.0

transit_vlans: [930]
transit_interfaces:
  - name: Vlan930
    ip: 172.16.30.1
    mask: 255.255.255.252
    description: "Transit to SW-CORE"
ospf_process: 1
ospf_networks:
  - network: 10.10.30.0
    wildcard: 0.0.0.255
    area: 0
  - network: 172.16.30.0
    wildcard: 0.0.0.3
    area: 0
  - network: 10.99.99.13
    wildcard: 0.0.0.0
    area: 0
access_lists:
  - name: ACL_DMME_IN
    interface: Vlan30
    direction: in
    entries:
      - "deny ip 10.10.30.0 0.0.0.255 10.10.40.0 0.0.0.255"
      - "deny ip 10.10.30.0 0.0.0.255 10.10.20.0 0.0.0.255"
      - "deny ip 10.10.30.0 0.0.0.255 10.10.10.0 0.0.0.255"
      - "deny ip 10.10.30.0 0.0.0.255 10.99.99.0 0.0.0.255"
      - "deny ip any any"
  - name: ACL_MGMT_IN
    interface: Vlan99
    direction: in
    entries:
      - "permit tcp any any eq 22"
      - "permit udp host 10.99.99.30 any eq 161"
      - "deny ip any any"
